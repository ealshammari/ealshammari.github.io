<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:#fff;color:#1c1c1c;font-family:'Lato',sans-serif;font-weight:300;font-size:17px;line-height:1.75;}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(255,255,255,0.97);border-bottom:1px solid #efefef;padding:0 60px;height:68px;display:flex;align-items:center;justify-content:space-between;backdrop-filter:blur(8px);}

.nav-cta{background:#1c1c1c!important;color:#fff!important;padding:10px 22px!important;}

/* HEADER */
.page-header{padding:130px 60px 60px;max-width:1200px;margin:0 auto;}
.page-eyebrow{font-size:11px;letter-spacing:0.25em;text-transform:uppercase;color:#c0392b;margin-bottom:14px;font-weight:400;}
.page-title{font-family:'Playfair Display',serif;font-size:clamp(48px,7vw,88px);font-weight:400;line-height:1.0;color:#1c1c1c;}
.page-title em{font-style:italic;color:#c0392b;}
.page-subtitle{font-family:'Playfair Display',serif;font-style:italic;font-size:18px;color:#999;margin-top:12px;}

/* FILTER TABS */
.filters-bar{max-width:1200px;margin:0 auto;padding:0 60px 48px;display:flex;gap:0;flex-wrap:wrap;}
.filter-btn{font-family:'Lato',sans-serif;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;padding:10px 22px;border:1px solid #ddd;background:none;color:#888;cursor:pointer;transition:all .2s;margin-right:-1px;}

.filter-btn.active{background:#1c1c1c;color:#fff;border-color:#1c1c1c;z-index:1;position:relative;}

hr.divider{border:none;border-top:1px solid #efefef;margin:0 60px;}

/* POEMS GRID */
.poems-wrap{max-width:1200px;margin:0 auto;padding:48px 60px 100px;}
.poems-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:2px;}

/* POEM CARD */
.poem-card{background:#fff;border:1px solid #efefef;padding:44px 36px;cursor:pointer;transition:all .3s;position:relative;overflow:hidden;}
.poem-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:#c0392b;transform:scaleX(0);transform-origin:left;transition:transform .35s;}
.poem-card:hover{box-shadow:0 12px 40px rgba(0,0,0,0.08);transform:translateY(-3px);}
.poem-card:hover::before{transform:scaleX(1);}
.card-tag{font-size:10px;letter-spacing:0.25em;text-transform:uppercase;color:#c0392b;margin-bottom:16px;font-weight:400;}
.card-title{font-family:'Noto Naskh Arabic',serif;font-size:26px;font-weight:600;direction:rtl;text-align:right;color:#1c1c1c;margin-bottom:18px;line-height:1.3;}
.card-excerpt{font-family:'Noto Naskh Arabic',serif;font-size:17px;line-height:2;direction:rtl;text-align:right;color:#777;}
.card-footer{margin-top:24px;padding-top:18px;border-top:1px solid #f5f5f5;display:flex;justify-content:flex-end;}
.card-read{font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:#c0392b;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.72);z-index:1000;display:flex;align-items:center;justify-content:center;padding:40px;opacity:0;pointer-events:none;transition:opacity .35s;backdrop-filter:blur(6px);}

.modal-box{background:#fff;max-width:700px;width:100%;max-height:88vh;overflow-y:auto;padding:64px;position:relative;transform:translateY(16px);transition:transform .35s;}
.modal-overlay.open .modal-box{transform:translateY(0);}
.modal-close{position:absolute;top:24px;right:28px;font-family:'Lato',sans-serif;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;background:none;border:none;cursor:pointer;color:#aaa;transition:color .2s;}
.modal-close:hover{color:#1c1c1c;}
.modal-title{font-family:'Noto Naskh Arabic',serif;font-size:36px;font-weight:600;direction:rtl;text-align:right;color:#1c1c1c;margin-bottom:12px;line-height:1.2;}
.modal-divider{width:50px;height:3px;background:#c0392b;margin:0 0 32px auto;}
.modal-body{font-family:'Noto Naskh Arabic',serif;font-size:22px;line-height:2.3;direction:rtl;text-align:right;color:#333;white-space:pre-line;}

/* FOOTER */
footer{background:#1c1c1c;color:#777;padding:28px 60px;display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:0.05em;}

/* ANIMATIONS */
.reveal{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease;}
.reveal.visible{opacity:1;transform:translateY(0);}

/* MOBILE */
@media(max-width:900px){

  .modal-box{padding:36px 24px;}
  footer{flex-direction:column;gap:8px;text-align:center;padding:24px;}
}

وَأَنَا المُتَيَّمُ فِي هَوَاكِ عَلِيلُ
هَذِي الكُوَيتُ وَمَا لِحُبِّي مَوْئِلٌ
إِلَّا ثَرَاكِ.. وَلا سِوَاهُ بَدِيلُ
هَذِي الكُوَيتُ وَمَا لِحُبِّي مَنزلٌ
إِلَّا ثَرَاكِ.. وَلا سِوَاهُ بَدِيلُ`
  },
  {
    id: 9,
    title: 'وسمية المنصور',
    tag: 'إهداءات',
    category: 'other',
    excerpt: 'وُسِمَتْ بِإِسْمِكِ لِلْمَعارِف بَصْمَةٌ\nفِي كُلِّ شِبْرٍ من حَيَاكِ حَدَائِقُ',
    text: `وُسِمَتْ بِإِسْمِكِ لِلْمَعارِف بَصْمَةٌ
فِي كُلِّ شِبْرٍ من حَيَاكِ حَدَائِقُ
مَا كُنْت "تَاءً" لِلتَّأَنُّث إِنَّما
أَنتِ المَنار، وَللأنام بَوَارقُ
يا أُمَّ طَالبةِ العلوم وَعونها
مَنْ لِلْقَوَاعد بعد فَقْدك عَاشقُ؟`
  }
];

let activeFilter = 'all';

function render() {
  const grid = document.getElementById('grid');
  const list = activeFilter === 'all' ? poems : poems.filter(p => p.category === activeFilter);
  grid.innerHTML = list.map((p, i) => `
    <div class="poem-card reveal" onclick="open(${p.id})" style="transition-delay:${i*60}ms">
      <div class="card-tag">${p.tag}</div>
      <div class="card-title">${p.title}</div>
      <div class="card-excerpt">${p.excerpt}</div>
      <div class="card-footer"><span class="card-read">اقرأ القصيدة →</span></div>
    </div>`).join('');
  setTimeout(() => document.querySelectorAll('.reveal').forEach(el => el.classList.add('visible')), 50);
}

function filter(cat, btn) {
  activeFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function open(id) {
  const p = poems.find(x => x.id === id);
  if (!p) return;
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-title">${p.title}</div>
    <div class="modal-divider"></div>
    <div class="modal-body">${p.text}</div>`;
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
}
function closeOutside(e) {
  if (e.target === document.getElementById('modal')) closeModal();
}

render();
</script>
</body>
</html>
