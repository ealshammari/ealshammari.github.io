<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poetry — Dr. Eiman Al-Shammari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Lato:wght@300;400;700&family=Noto+Naskh+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:#fff;color:#1c1c1c;font-family:'Lato',sans-serif;font-weight:300;font-size:17px;line-height:1.75;}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(255,255,255,0.97);border-bottom:1px solid #efefef;padding:0 60px;height:68px;display:flex;align-items:center;justify-content:space-between;backdrop-filter:blur(8px);}
.nav-logo{font-family:'Playfair Display',serif;font-size:20px;font-weight:400;color:#1c1c1c;text-decoration:none;}
.nav-links{list-style:none;display:flex;gap:32px;align-items:center;}
.nav-links a{font-family:'Lato',sans-serif;font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:#666;text-decoration:none;transition:color .2s;}
.nav-links a:hover,.nav-links a.active{color:#1c1c1c;}
.nav-cta{background:#1c1c1c!important;color:#fff!important;padding:10px 22px!important;transition:background .2s!important;}
.nav-cta:hover{background:#c0392b!important;}

/* PAGE HEADER */
.page-header{padding:130px 60px 60px;max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:24px;}
.header-left{}
.page-eyebrow{font-size:11px;letter-spacing:0.25em;text-transform:uppercase;color:#c0392b;margin-bottom:14px;font-weight:400;}
.page-title{font-family:'Playfair Display',serif;font-size:clamp(48px,7vw,88px);font-weight:400;line-height:1.0;color:#1c1c1c;}
.page-title em{font-style:italic;color:#c0392b;}
.page-subtitle{font-family:'Playfair Display',serif;font-style:italic;font-size:18px;color:#999;margin-top:12px;}

/* ADD BUTTON */
.add-poem-btn{display:inline-flex;align-items:center;gap:10px;background:#1c1c1c;color:#fff;padding:14px 28px;font-family:'Lato',sans-serif;font-size:11px;letter-spacing:0.15em;text-transform:uppercase;border:none;cursor:pointer;transition:background .2s;white-space:nowrap;}
.add-poem-btn:hover{background:#c0392b;}

/* FILTERS */
.filters-bar{max-width:1200px;margin:0 auto;padding:0 60px 48px;display:flex;gap:0;}
.filter-btn{font-family:'Lato',sans-serif;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;padding:10px 22px;border:1px solid #ddd;background:none;color:#888;cursor:pointer;transition:all .2s;margin-right:-1px;}
.filter-btn:hover{border-color:#1c1c1c;color:#1c1c1c;z-index:1;position:relative;}
.filter-btn.active{background:#1c1c1c;color:#fff;border-color:#1c1c1c;z-index:1;position:relative;}

/* DIVIDER */
hr.divider{border:none;border-top:1px solid #efefef;margin:0 60px;}

/* POEMS GRID */
.poems-wrap{max-width:1200px;margin:0 auto;padding:48px 60px 100px;}
.poems-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:2px;}

/* POEM CARD */
.poem-card{background:#fff;border:1px solid #efefef;padding:44px 36px;cursor:pointer;transition:all .3s;position:relative;overflow:hidden;}
.poem-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:#c0392b;transform:scaleX(0);transform-origin:left;transition:transform .35s;}
.poem-card:hover{box-shadow:0 12px 40px rgba(0,0,0,0.08);transform:translateY(-3px);}
.poem-card:hover::before{transform:scaleX(1);}
.card-lang{font-size:10px;letter-spacing:0.25em;text-transform:uppercase;color:#c0392b;margin-bottom:16px;font-weight:400;}
.card-title{font-family:'Playfair Display',serif;font-size:24px;font-weight:400;line-height:1.2;color:#1c1c1c;margin-bottom:18px;}
.card-title.ar{font-family:'Noto Naskh Arabic',serif;direction:rtl;text-align:right;font-size:26px;}
.card-excerpt{font-size:16px;line-height:1.9;color:#777;font-style:italic;}
.card-excerpt.ar{font-family:'Noto Naskh Arabic',serif;direction:rtl;text-align:right;font-style:normal;font-size:18px;line-height:2;}
.card-footer{margin-top:28px;padding-top:20px;border-top:1px solid #f5f5f5;display:flex;justify-content:space-between;align-items:center;}
.card-date{font-size:12px;color:#bbb;letter-spacing:0.08em;}
.card-read{font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:#c0392b;}

/* EMPTY STATE */
.empty-state{grid-column:1/-1;text-align:center;padding:100px 40px;}
.empty-icon{font-size:56px;margin-bottom:28px;opacity:0.2;}
.empty-title{font-family:'Playfair Display',serif;font-size:28px;font-weight:400;color:#1c1c1c;margin-bottom:12px;}
.empty-text{font-size:17px;font-style:italic;color:#aaa;margin-bottom:36px;}

/* POEM MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;display:flex;align-items:center;justify-content:center;padding:40px;opacity:0;pointer-events:none;transition:opacity .35s;backdrop-filter:blur(6px);}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal-box{background:#fff;max-width:680px;width:100%;max-height:85vh;overflow-y:auto;padding:64px;position:relative;transform:translateY(16px);transition:transform .35s;}
.modal-overlay.open .modal-box{transform:translateY(0);}
.modal-close{position:absolute;top:24px;right:28px;font-family:'Lato',sans-serif;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;background:none;border:none;cursor:pointer;color:#aaa;transition:color .2s;}
.modal-close:hover{color:#1c1c1c;}
.modal-title{font-family:'Playfair Display',serif;font-size:38px;font-weight:400;line-height:1.1;color:#1c1c1c;margin-bottom:36px;}
.modal-title.ar{font-family:'Noto Naskh Arabic',serif;direction:rtl;text-align:right;}
.modal-body{font-size:21px;line-height:2.2;font-style:italic;color:#333;white-space:pre-line;}
.modal-body.ar{font-family:'Noto Naskh Arabic',serif;direction:rtl;text-align:right;font-style:normal;font-size:23px;}
.modal-note{margin-top:36px;padding-top:24px;border-top:1px solid #f0f0f0;font-size:14px;font-style:italic;color:#bbb;}
.modal-delete{position:absolute;bottom:24px;right:28px;font-family:'Lato',sans-serif;font-size:10px;letter-spacing:0.15em;text-transform:uppercase;background:none;border:1px solid #eee;color:#ccc;padding:8px 16px;cursor:pointer;transition:all .2s;}
.modal-delete:hover{border-color:#c0392b;color:#c0392b;}

/* ADD POEM FORM */
.form-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:1001;display:flex;align-items:center;justify-content:center;padding:40px;opacity:0;pointer-events:none;transition:opacity .35s;backdrop-filter:blur(6px);}
.form-overlay.open{opacity:1;pointer-events:all;}
.form-box{background:#1c1c1c;max-width:700px;width:100%;max-height:90vh;overflow-y:auto;padding:60px;position:relative;transform:translateY(16px);transition:transform .35s;border-top:3px solid #c0392b;}
.form-overlay.open .form-box{transform:translateY(0);}
.form-close{position:absolute;top:24px;right:28px;font-family:'Lato',sans-serif;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;background:none;border:none;cursor:pointer;color:#666;transition:color .2s;}
.form-close:hover{color:#fff;}
.form-title{font-family:'Playfair Display',serif;font-size:34px;font-weight:400;color:#fff;margin-bottom:40px;}
.form-title em{font-style:italic;color:#c0392b;}
.form-group{margin-bottom:28px;}
.form-label{font-size:10px;letter-spacing:0.25em;text-transform:uppercase;color:#c0392b;display:block;margin-bottom:10px;font-weight:400;}
.form-input,.form-select,.form-textarea{width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:#fff;padding:14px 18px;font-family:'Lato',sans-serif;font-size:16px;outline:none;transition:border-color .2s;resize:none;}
.form-input:focus,.form-textarea:focus{border-color:#c0392b;}
.form-input::placeholder,.form-textarea::placeholder{color:#555;}
.form-textarea{min-height:200px;line-height:1.9;}
.form-textarea.rtl{direction:rtl;text-align:right;font-family:'Noto Naskh Arabic',serif;font-size:20px;}
.form-select{cursor:pointer;}
.form-select option{background:#1c1c1c;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.form-hint{font-size:13px;color:#555;margin-top:6px;font-style:italic;}
.btn-submit{width:100%;padding:18px;background:#c0392b;color:#fff;border:none;font-family:'Lato',sans-serif;font-size:11px;letter-spacing:0.25em;text-transform:uppercase;cursor:pointer;transition:background .2s;margin-top:8px;}
.btn-submit:hover{background:#a93226;}

footer{background:#1c1c1c;color:#777;padding:28px 60px;display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:0.05em;}

@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease;}
.reveal.visible{opacity:1;transform:translateY(0);}

@media(max-width:900px){
  nav{padding:0 20px;} .nav-links{display:none;}
  .page-header{padding:110px 24px 40px;flex-direction:column;align-items:flex-start;}
  .filters-bar{padding:0 24px 36px;}
  hr.divider{margin:0 24px;}
  .poems-wrap{padding:36px 24px 80px;}
  .poems-grid{grid-template-columns:1fr;}
  .modal-box,.form-box{padding:36px 24px;}
  .form-row{grid-template-columns:1fr;}
  footer{flex-direction:column;gap:8px;text-align:center;padding:24px;}
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">Eiman Al-Shammari</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="books.html">Books</a></li>
    <li><a href="blog.html" class="active">Poetry</a></li>
    <li><a href="articles.html">Articles</a></li>
    <li><a href="gallery.html">Gallery</a></li>
    <li><a href="interviews.html">Interviews</a></li>
    <li><a href="index.html#contact" class="nav-cta">Contact</a></li>
  </ul>
</nav>

<div class="page-header">
  <div class="header-left">
    <div class="page-eyebrow">المدوّنة الشعرية</div>
    <h1 class="page-title">Poetry <em>Blog</em></h1>
    <div class="page-subtitle">Verses in Arabic & English</div>
  </div>
  <button class="add-poem-btn" onclick="openForm()">+ Add New Poem</button>
</div>

<div class="filters-bar">
  <button class="filter-btn active" onclick="filterPoems('all', this)">All</button>
  <button class="filter-btn" onclick="filterPoems('arabic', this)">عربي</button>
  <button class="filter-btn" onclick="filterPoems('english', this)">English</button>
  <button class="filter-btn" onclick="filterPoems('bilingual', this)">Bilingual</button>
</div>

<hr class="divider">

<div class="poems-wrap">
  <div class="poems-grid" id="poemsGrid"></div>
</div>

<footer>
  <span>© 2025 Dr. Eiman Al-Shammari</span>
  <span>Poetry Blog</span>
</footer>

<!-- POEM MODAL -->
<div class="modal-overlay" id="poemModal" onclick="closeModalOutside(event)">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">✕ Close</button>
    <div id="modalContent"></div>
    <button class="modal-delete" id="deleteBtn" onclick="deleteCurrentPoem()">Delete Poem</button>
  </div>
</div>

<!-- ADD POEM FORM -->
<div class="form-overlay" id="formOverlay" onclick="closeFormOutside(event)">
  <div class="form-box">
    <button class="form-close" onclick="closeForm()">✕ Close</button>
    <div class="form-title">Add a New <em>Poem</em></div>

    <div class="form-group">
      <label class="form-label">Poem Title / عنوان القصيدة</label>
      <input type="text" class="form-input" id="poemTitle" placeholder="Enter title...">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Language</label>
        <select class="form-select form-input" id="poemLang" onchange="toggleFields()">
          <option value="arabic">Arabic — عربي</option>
          <option value="english">English</option>
          <option value="bilingual">Bilingual — ثنائي</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Year / السنة</label>
        <input type="text" class="form-input" id="poemDate" placeholder="e.g. 2024">
      </div>
    </div>

    <div class="form-group" id="arabicField">
      <label class="form-label">Poem Text in Arabic / نص القصيدة</label>
      <textarea class="form-textarea rtl" id="poemTextAr" placeholder="اكتبي قصيدتك هنا...&#10;كل سطر على حدة"></textarea>
      <div class="form-hint">اضغطي Enter لكل سطر جديد</div>
    </div>

    <div class="form-group" id="englishField" style="display:none">
      <label class="form-label">Poem Text in English</label>
      <textarea class="form-textarea" id="poemTextEn" placeholder="Write your poem here...&#10;One line per Enter"></textarea>
    </div>

    <div class="form-group">
      <label class="form-label">Note / ملاحظة (optional)</label>
      <input type="text" class="form-input" id="poemNote" placeholder="e.g. Published in Al-Jarida, 2023">
    </div>

    <button class="btn-submit" onclick="savePoem()">Publish Poem — نشر القصيدة</button>
  </div>
</div>

<script>
const KEY = 'eiman_poems_v2';
let poems = JSON.parse(localStorage.getItem(KEY) || '[]');
let activeFilter = 'all';
let currentPoemId = null;

// ── RENDER ──
function render() {
  const grid = document.getElementById('poemsGrid');
  const list = activeFilter === 'all' ? poems : poems.filter(p => p.lang === activeFilter);

  if (list.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">✦</div>
        <div class="empty-title">${activeFilter === 'all' ? 'Your poetry awaits' : 'No poems here yet'}</div>
        <div class="empty-text">Click "Add New Poem" to publish your first verse.</div>
        <button class="add-poem-btn" onclick="openForm()" style="margin:0 auto;display:inline-flex;">+ Add New Poem</button>
      </div>`;
    return;
  }

  grid.innerHTML = list.map((poem, i) => {
    const isAr = poem.lang !== 'english';
    const excerpt = isAr
      ? (poem.textAr || '').split('\n').slice(0, 4).join('\n')
      : (poem.textEn || '').split('\n').slice(0, 4).join('\n');
    const langLabel = poem.lang === 'arabic' ? 'ARABIC · عربي'
      : poem.lang === 'english' ? 'ENGLISH'
      : 'BILINGUAL · ثنائي';
    return `
      <div class="poem-card reveal" onclick="openPoem(${poem.id})" style="transition-delay:${i*60}ms">
        <div class="card-lang">${langLabel}</div>
        <div class="card-title ${isAr ? 'ar' : ''}">${poem.title}</div>
        <div class="card-excerpt ${isAr ? 'ar' : ''}">${excerpt}</div>
        <div class="card-footer">
          <span class="card-date">${poem.date || ''}</span>
          <span class="card-read">Read →</span>
        </div>
      </div>`;
  }).join('');

  setTimeout(() => {
    document.querySelectorAll('.reveal').forEach(el => el.classList.add('visible'));
  }, 50);
}

// ── FILTER ──
function filterPoems(lang, btn) {
  activeFilter = lang;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

// ── OPEN POEM ──
function openPoem(id) {
  const poem = poems.find(p => p.id === id);
  if (!poem) return;
  currentPoemId = id;
  const isAr = poem.lang !== 'english';
  let html = `<div class="modal-title ${isAr ? 'ar' : ''}">${poem.title}</div>`;
  if (poem.textAr) html += `<div class="modal-body ar">${poem.textAr}</div>`;
  if (poem.textEn) html += `<div class="modal-body" style="margin-top:${poem.textAr?'32px':'0'}">${poem.textEn}</div>`;
  if (poem.note) html += `<div class="modal-note">${poem.note}</div>`;
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('poemModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  document.getElementById('poemModal').classList.remove('open');
  document.body.style.overflow = '';
  currentPoemId = null;
}
function closeModalOutside(e) {
  if (e.target === document.getElementById('poemModal')) closeModal();
}

// ── DELETE ──
function deleteCurrentPoem() {
  if (!currentPoemId) return;
  if (!confirm('Delete this poem?')) return;
  poems = poems.filter(p => p.id !== currentPoemId);
  localStorage.setItem(KEY, JSON.stringify(poems));
  closeModal();
  render();
}

// ── ADD POEM FORM ──
function openForm() {
  document.getElementById('formOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeForm() {
  document.getElementById('formOverlay').classList.remove('open');
  document.body.style.overflow = '';
}
function closeFormOutside(e) {
  if (e.target === document.getElementById('formOverlay')) closeForm();
}

function toggleFields() {
  const lang = document.getElementById('poemLang').value;
  document.getElementById('arabicField').style.display = (lang === 'arabic' || lang === 'bilingual') ? 'block' : 'none';
  document.getElementById('englishField').style.display = (lang === 'english' || lang === 'bilingual') ? 'block' : 'none';
}

function savePoem() {
  const title = document.getElementById('poemTitle').value.trim();
  const lang = document.getElementById('poemLang').value;
  const date = document.getElementById('poemDate').value.trim();
  const textAr = document.getElementById('poemTextAr').value.trim();
  const textEn = document.getElementById('poemTextEn').value.trim();
  const note = document.getElementById('poemNote').value.trim();

  if (!title) { alert('Please enter a title / أدخلي عنواناً'); return; }
  if (!textAr && !textEn) { alert('Please enter the poem text / أدخلي نص القصيدة'); return; }

  const poem = { id: Date.now(), title, lang, date, textAr, textEn, note };
  poems.unshift(poem);
  localStorage.setItem(KEY, JSON.stringify(poems));

  // Reset form
  ['poemTitle','poemDate','poemTextAr','poemTextEn','poemNote'].forEach(id => document.getElementById(id).value = '');

  closeForm();
  activeFilter = 'all';
  document.querySelectorAll('.filter-btn').forEach((b,i) => b.classList.toggle('active', i===0));
  render();
}

// ── INIT ──
render();
</script>
</body>
</html>
